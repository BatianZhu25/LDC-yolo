# VisDrone2019-DET dataset config.
# Update `path` to the local dataset root before training.
# YOLO labels: zero-based class IDs and normalized xywh. See data/README.md.
# This layout is a preparation template; exact manuscript split records are pending.

path: /path/to/VisDrone
train: images/train
val: images/val
test: images/test

names:
  0: pedestrian
  1: people
  2: bicycle
  3: car
  4: van
  5: truck
  6: tricycle
  7: awning-tricycle
  8: bus
  9: motor
