# LDC-YOLO model configuration.
#
# The architecture uses P2/P3/P4 detection heads for dense small-object
# detection in aerial imagery.

nc: 10  # VisDrone default; training overrides this from the dataset YAML.
scale: n
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]

backbone:
  - [-1, 1, DLStem, [64, 3, 2, 1.0]]
  - [-1, 1, GhostBottleneckV2, [128, 3, 2]]
  - [-1, 3, C2fLGDI, [128, True, 1, 0.5, True]]
  - [-1, 1, GhostBottleneckV2, [256, 3, 2]]
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, GhostBottleneckV2, [512, 3, 2]]
  - [-1, 6, C2fRPMK, [512, True, [1, 3, 5, 7, 9, 11]]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 3, C2f, [128, False]]

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]

  - [[12, 15, 18], 1, VisDroneDCNDetect, [nc]]
