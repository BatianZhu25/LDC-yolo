name: ldc-yolo

channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pytorch>=2.0,<2.6
  - torchvision>=0.15,<0.21
  - pytorch-cuda=11.8
  - numpy
  - pyyaml
  - opencv
  - pip>=23
  - pip:
      - ultralytics==8.3.0
      - rich
      - pytest
      - pre-commit
